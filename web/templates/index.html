<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Biblioteca{% endblock %} · Registro de ingresos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header>
    <div class="logo">
      <img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo de la biblioteca">
      <h2>Biblioteca - Registro de ingresos</h2>
    </div>
    <nav>
      <a href="/">Registro</a>
      <a href="/cadena">Cadena</a>
    </nav>
    </div>
</header>
  <main>
    {% block contenido %}{% endblock %}
  </main>




      <!-- JQUERY -->
    <script src="https://code.jquery.com/jquery-3.4.1.js"
        integrity="sha256-WpOohJOqMqqyKL9FccASB9O0KwACQJpFTUBLTYOVvVU=" crossorigin="anonymous">
        </script>
    <!-- DATATABLES -->
    <script src="https://cdn.datatables.net/1.10.20/js/jquery.dataTables.min.js">
    </script>
    <script>
  $(document).ready(function () {
    $('#tablax').DataTable({
        "order": [[0, "asc"]],
        "searching": false,
            "lengthChange": false,
                "language": {
                 "info": "Mostrando del item _START_ al _END_ de un total de _TOTAL_ items",
                  "paginate": {
                "previous": "Anterior",
                "next": "Siguiente",

            }
        },
        "columnDefs": [
            {
                "targets": 0,
                "type": "num"
            }
        ]
    });
});
    </script>
</body>
</html>
